name: Bump plugin versions

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'

permissions:
  contents: write

# Serialize runs: parallel bumps would compute versions from stale checkouts
# and fail each other's push. Note GitHub keeps at most one *pending* run per
# group — when several pushes queue up, the intermediate runs are cancelled, not
# stacked. That's why the bump step diffs from the last bump commit rather than
# trusting event.before: a cancelled run's range is folded into the next run.
# See more: https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency#example-concurrency-groups
concurrency:
  group: bump-plugin-versions
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump changed plugin versions
        run: |
          # Diff from the last bump commit when one exists: it marks the last state
          # whose versions are known-good, so the range self-heals across cancelled
          # queued runs and force pushes. event.before covers the no-bump-yet case.
          base="$(git log -1 --format=%H --grep='^chore: bump plugin versions' HEAD)"
          if [ -z "$base" ]; then base="${{ github.event.before }}"; fi
          node scripts/bump-plugin-versions.mjs "$base" "${{ github.sha }}"

      - name: Commit and push version bumps
        run: |
          if git diff --quiet; then
            echo "No version changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/*/.claude-plugin/plugin.json .claude-plugin/marketplace.json
          # Pushes made with GITHUB_TOKEN never re-trigger on:push workflows, so no
          # recursion is possible; [skip ci] is belt-and-suspenders in case this ever
          # switches to a PAT/App token.
          git commit -m "chore: bump plugin versions [skip ci]"
          # Reconcile with anything that landed on main while this run was working.
          git pull --rebase origin main
          git push
